[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; ── FastAPI backend (port 8000 — internal, not exposed to public) ──────────────
[program:backend]
command=uvicorn src.api.server:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Streamlit frontend (port 7860 — required by HuggingFace Spaces) ───────────
; startsecs=10 gives the backend 10 s head-start before Streamlit health-checks it
[program:frontend]
command=streamlit run app.py --server.port 7860 --server.address 0.0.0.0 --server.headless true
directory=/app
autostart=true
autorestart=true
priority=2
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=BACKEND_URL="http://localhost:8000"
